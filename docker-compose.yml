services:
  pubsub-provider:
    image: ghcr.io/bitsocialnet/pubsub-provider:latest
    build:
      context: .
    container_name: pubsub-provider
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUBSUB_PROVIDER_HOST: 0.0.0.0
      PUBSUB_PROVIDER_PORTS: "8000"
      PUBSUB_PROVIDER_SWARM_PORT: "${PUBSUB_PROVIDER_SWARM_PORT:-4002}"
      KUBO_RPC_URL: http://127.0.0.1:5001/api/v0
      IPFS_GATEWAY_URL: http://127.0.0.1:8080
      IPFS_PATH: /data/ipfs
      HTTP_ROUTER_URLS: "${HTTP_ROUTER_URLS:-}"
      BASIC_AUTH_USERNAME: "${BASIC_AUTH_USERNAME:-}"
      BASIC_AUTH_PASSWORD: "${BASIC_AUTH_PASSWORD:-}"
      IPFS_GATEWAY_USE_SUBDOMAINS: "${IPFS_GATEWAY_USE_SUBDOMAINS:-false}"
      SHUTDOWN_KEY: "${SHUTDOWN_KEY:-}"
    ports:
      - "${PUBSUB_PROVIDER_HTTP_PORT:-80}:8000"
      - "${PUBSUB_PROVIDER_SWARM_PORT:-4002}:${PUBSUB_PROVIDER_SWARM_PORT:-4002}/tcp"
      - "${PUBSUB_PROVIDER_SWARM_PORT:-4002}:${PUBSUB_PROVIDER_SWARM_PORT:-4002}/udp"
    volumes:
      - pubsub-provider-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  pubsub-provider-data:
